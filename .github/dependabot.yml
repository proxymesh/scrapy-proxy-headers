version: 2
updates:
  # Grouping reduces PR noise; all version updates (including majors) auto-merge via
  # .github/workflows/dependabot-auto-merge.yml once required checks pass.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "automerge"
    groups:
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      prod-major:
        dependency-type: "production"
        update-types:
          - "major"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      dev-major:
        dependency-type: "development"
        update-types:
          - "major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automerge"
    groups:
      actions:
        patterns:
          - "*"
