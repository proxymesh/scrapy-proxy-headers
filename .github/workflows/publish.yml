# Pull requests: lint the release workflows, dry-run the version check, and
# build the sdist and wheel. Merging release/X.Y.Z from this repo also
# publishes to PyPI and opens the GitHub Release.

name: Publish to PyPI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Release check
    if: >-
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          expected=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          url="https://github.com/rhysd/actionlint/releases/download"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "${url}/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${expected}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint release workflows
        run: |
          set -euo pipefail
          actionlint -version
          actionlint \
            .github/workflows/prepare-release.yml \
            .github/workflows/publish.yml

      - name: Dry-run version and changelog checks
        run: python scripts/test_release_tools.py

      - name: Check release branch
        id: ver
        if: startsWith(github.head_ref, 'release/')
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          version="$(python scripts/release_tools.py check \
            --branch "$RELEASE_BRANCH")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Save build outputs
        if: >-
          github.event.pull_request.merged == true &&
          steps.ver.outputs.version != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/release_tools.py notes \
            --version "$VERSION" > release-notes.md

      - name: Upload distributions
        if: >-
          github.event.pull_request.merged == true &&
          steps.ver.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload release notes
        if: >-
          github.event.pull_request.merged == true &&
          steps.ver.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: check
    if: >-
      needs.check.result == 'success' &&
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: release
      url: https://pypi.org/p/scrapy-proxy-headers
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Decide whether to publish
        id: decide
        env:
          VERSION: ${{ needs.check.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_tools.py decide

      - name: Publish to PyPI
        if: >-
          steps.decide.outputs.decision == 'publish-and-release' ||
          steps.decide.outputs.decision == 'publish-only'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [check, publish]
    if: >-
      needs.publish.result == 'success' &&
      (needs.publish.outputs.decision == 'publish-and-release' ||
       needs.publish.outputs.decision == 'release-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Create GitHub release
        env:
          VERSION: ${{ needs.check.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" \
            --title "v${VERSION}" \
            --notes-file notes/release-notes.md
