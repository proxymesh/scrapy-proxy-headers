# push to main: publish when the commit is a merged release/X.Y.Z pull request.

name: Publish to PyPI

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  lookup:
    name: Lookup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read this commit
      pull-requests: read # list the pull request for this commit
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Find the release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          mapfile -t refs < <(
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(
                  .base.ref == "main"
                  and .merged_at != null
                  and (.head.ref | startswith("release/"))
                  and .head.repo.full_name == $repo
                )
              | .head.ref
            ' <<<"$pulls"
          )
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "Not a release merge."
            exit 0
          fi
          if [ "${#refs[@]}" -ne 1 ]; then
            echo "This commit matches more than one release pull request." >&2
            exit 1
          fi
          version="${refs[0]#release/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to PyPI
    needs: lookup
    if: needs.lookup.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout the release commit
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check version and changelog
        env:
          HEAD_REF: release/${{ needs.lookup.outputs.version }}
        run: python .github/scripts/release_lib.py check

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: lookup
    if: needs.lookup.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.lookup.outputs.version }}
        run: |
          set -euo pipefail
          python .github/scripts/release_lib.py notes > "$RUNNER_TEMP/notes.md"
          gh release view "v${VERSION}" \
            || gh release create "v${VERSION}" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md"
