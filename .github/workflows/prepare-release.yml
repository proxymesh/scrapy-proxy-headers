# Bump the version manifests, move CHANGELOG Unreleased, and open a release PR.
# Does not merge and does not publish.

name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z, or patch, minor, or major"
        required: true
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the main branch
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run Prepare release from main." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Bump version and changelog
        id: prep
        env:
          RELEASE_SPEC: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python scripts/release_tools.py prepare \
            --spec "$RELEASE_SPEC" \
            --notes-file "$RUNNER_TEMP/notes.md")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release branch
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          ref="refs/heads/release/${VERSION}"
          if git ls-remote --exit-code origin "$ref" >/dev/null 2>&1; then
            echo "Branch release/${VERSION} already exists." >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Open the release pull request
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/${VERSION}"
          git add -- pyproject.toml docs/conf.py CHANGELOG.md
          git commit -m "chore: prepare release ${VERSION}"
          git push origin "HEAD:release/${VERSION}"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "release/${VERSION}" \
            --title "Release ${VERSION}" \
            --body-file "$RUNNER_TEMP/notes.md"
