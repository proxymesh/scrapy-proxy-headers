# Compatibility tests against released Scrapy and Scrapy master.
# Runs on ubuntu-24.04 only. Scrapy master cells are required: a failure
# fails this workflow (there is no continue-on-error). The weekly schedule
# re-runs those master cells from the default branch after this workflow
# is merged. It does not change repository settings or publish a release.

name: Tests

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  compat:
    name: py${{ matrix.python }} / scrapy ${{ matrix.scrapy }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        scrapy: ["2.14.2", "2.18", "2.19.0", "latest", "master"]
        exclude:
          # Scrapy master requires Python >= 3.11.
          - python: "3.10"
            scrapy: master
          # Scrapy 2.14.2 classifiers: CPython 3.10–3.13.
          - python: "3.14"
            scrapy: "2.14.2"
          - python: "3.15"
            scrapy: "2.14.2"
          # Scrapy 2.18 classifiers stop at CPython 3.14.
          - python: "3.15"
            scrapy: "2.18"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Scrapy ${{ matrix.scrapy }} and the package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          case "${{ matrix.scrapy }}" in
            2.14.2)
              pip install "Scrapy==2.14.2"
              ;;
            2.18)
              pip install "Scrapy>=2.18,<2.19"
              ;;
            2.19.0)
              pip install "Scrapy==2.19.0"
              ;;
            latest)
              pip install --upgrade Scrapy
              ;;
            master)
              pip install "git+https://github.com/scrapy/scrapy@master"
              ;;
            *)
              echo "Unknown Scrapy matrix value: ${{ matrix.scrapy }}"
              exit 1
              ;;
          esac
          python - << 'PY'
          import platform
          import scrapy
          import scrapy_proxy_headers
          print("python", platform.python_version())
          print("scrapy", scrapy.__version__)
          print("detection", scrapy_proxy_headers.detection_details())
          PY

      - name: Run tests
        run: pytest -v

  # Weekly re-check of Scrapy master. Pull requests already run master inside
  # the compat matrix above, and those cells are required to pass.
  master-weekly:
    name: weekly py${{ matrix.python }} / scrapy master
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        scrapy: ["master"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Scrapy master and the package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "git+https://github.com/scrapy/scrapy@master"
          python - << 'PY'
          import platform
          import scrapy
          import scrapy_proxy_headers
          print("python", platform.python_version())
          print("scrapy", scrapy.__version__)
          print("detection", scrapy_proxy_headers.detection_details())
          PY

      - name: Run tests
        run: pytest -v
