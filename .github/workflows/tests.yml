# Compatibility tests. Separate from proxy integration, which requires PROXY_URL.

name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compat:
    name: py${{ matrix.python }} / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            name: "2.17.0"
            pip: "Scrapy==2.17.0"
          - python: "3.13"
            name: "2.19.0"
            pip: "Scrapy==2.19.0"
          - python: "3.13"
            name: latest
            pip: "--upgrade Scrapy"
          - python: "3.13"
            name: master
            pip: "--upgrade --force-reinstall git+https://github.com/scrapy/scrapy@master"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install and test
        env:
          MATRIX_PIP: ${{ matrix.pip }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          read -r -a pip_args <<< "$MATRIX_PIP"
          pip install "${pip_args[@]}"
          if [ "$MATRIX_NAME" = "master" ]; then
            python -c "import scrapy_proxy_headers.native"
          fi
          pytest -q
