# Version manifests, changelog section, and package build on pull requests.

name: Release check

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Release check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout the pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check version and changelog
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: python scripts/release_version.py check --branch "$RELEASE_BRANCH"

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
